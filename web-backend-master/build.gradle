plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'redlib'
version = '2.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    mybatisGenerator
}

repositories {
    mavenCentral()
}

dependencies {
    // MyBatis-Plus：极速开发增删改查
    implementation 'com.baomidou:mybatis-plus-boot-starter:3.5.3.1'
    // Lombok：让代码更整洁
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.31'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'
    implementation 'eu.bitwalker:UserAgentUtils:1.21'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'org.apache.poi:poi:5.5.1'

    annotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.projectlombok:lombok'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'
    mybatisGenerator files('lib/mybatis-generator-core-reform-1.3.5.jar')
    mybatisGenerator 'com.mysql:mysql-connector-j'
    mybatisGenerator 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

def asciiTestRuntimeRoot = file("${System.properties['user.home']}/.gradle/codex-test-runtime/${rootProject.name}")
def asciiTestClassesDir = file("${asciiTestRuntimeRoot}/classes/java/test")
def asciiTestResourcesDir = file("${asciiTestRuntimeRoot}/resources/test")
def asciiMainClassesDir = file("${asciiTestRuntimeRoot}/classes/java/main")
def asciiMainResourcesDir = file("${asciiTestRuntimeRoot}/resources/main")

tasks.register('prepareAsciiTestRuntime') {
    dependsOn tasks.named('testClasses')
    outputs.dirs(asciiTestClassesDir, asciiTestResourcesDir, asciiMainClassesDir, asciiMainResourcesDir)
    outputs.upToDateWhen { false }
    doLast {
        copy {
            from("$buildDir/classes/java/test")
            into(asciiTestClassesDir)
        }
        copy {
            from("$buildDir/resources/test")
            into(asciiTestResourcesDir)
        }
        copy {
            from("$buildDir/classes/java/main")
            into(asciiMainClassesDir)
        }
        copy {
            from("$buildDir/resources/main")
            into(asciiMainResourcesDir)
        }
    }
}

tasks.named('test') {
    dependsOn tasks.named('prepareAsciiTestRuntime')
    testClassesDirs = files(asciiTestClassesDir)
    classpath = files(asciiTestClassesDir, asciiTestResourcesDir, asciiMainClassesDir, asciiMainResourcesDir) +
            (sourceSets.test.runtimeClasspath - files(
                    "$buildDir/classes/java/test",
                    "$buildDir/resources/test",
                    "$buildDir/classes/java/main",
                    "$buildDir/resources/main"
            ))
}

tasks.withType(JavaCompile) {
    options.encoding = "utf-8"
}

task mybatisGenerate {
    group 'mybatis generator'
    ant.taskdef(
            name: 'mbgenerator',
            classname: 'org.mybatis.generator.ant.GeneratorAntTask',
            classpath: configurations.mybatisGenerator.asPath
    )
    doLast {
        ant.mbgenerator(
                overwrite: true,
                configfile: 'src/main/resources/generatorConfig.xml', verbose: true
        )
    }
}
