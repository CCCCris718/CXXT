spring.jpa.show-sql=true
spring.jpa.database=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/notebook_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB
mybatis.mapperLocations=classpath:mapper/*.xml
mybatis.typeAliasesPackage=redlib.backend.model
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.serialization.fail_on_empty_beans=false
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
springdoc.swagger-ui.enabled=true
logging.level.redlib=debug
server.port=9311
notebook.ai.enabled=true
notebook.ai.provider=deepseek
notebook.ai.base-url=https://api.deepseek.com
notebook.ai.api-key=sk-e15a9da225cf4bba9949455468dc2ae3
notebook.ai.translation-model=deepseek-chat
notebook.ai.summary-model=deepseek-chat
notebook.ai.transcription-model=deepseek-chat
notebook.ai.max-audio-size-bytes=10485760
